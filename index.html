<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>BioPro Grid - Industrial Agriculture</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BioPro Grid">
  <meta name="theme-color" content="#0b1a0e">
  <meta name="msapplication-TileColor" content="#0b1a0e">
  <meta name="msapplication-navbutton-color" content="#4ade80">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3043/3043513.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --safe-area-inset-top: env(safe-area-inset-top);
      --safe-area-inset-bottom: env(safe-area-inset-bottom);
      --accent: #4ade80;
      --bg-jungle: #0b1a0e;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-jungle);
      color: #e5e5e5;
      margin: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-x pan-y;
      overflow-x: hidden;
      overflow-y: auto;
      width: 100vw;
      min-height: 100vh;
    }
    #root {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }
    input, textarea, .prose, .select-all {
      -webkit-user-select: text;
      user-select: text;
    }
    .glass {
      background: rgba(10, 25, 15, 0.7);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.03);
    }
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-jungle);
    }
    ::-webkit-scrollbar-thumb {
      background: #1a2e1e;
      border-radius: 20px;
    }
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .pt-safe { padding-top: var(--safe-area-inset-top); }
    .pb-safe { padding-bottom: var(--safe-area-inset-bottom); }
    .bg-grid {
      background-image:
        linear-gradient(rgba(74, 222, 128, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74, 222, 128, 0.02) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    @keyframes scan {
      0% { transform: translateY(-100%); opacity: 0; }
      50% { opacity: 0.2; }
      100% { transform: translateY(100%); opacity: 0; }
    }
    .scanner-line {
      height: 100%;
      width: 100%;
      background: linear-gradient(to bottom, transparent, var(--accent), transparent);
      position: absolute;
      animation: scan 3s linear infinite;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "react/": "https://esm.sh/react@^19.2.4/",
        "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
        "lucide-react": "https://esm.sh/lucide-react@^0.574.0",
        "recharts": "https://esm.sh/recharts@^3.7.0",
        "firebase/app": "https://esm.sh/firebase@^10.8.0/app",
        "firebase/auth": "https://esm.sh/firebase@^10.8.0/auth",
        "firebase/firestore": "https://esm.sh/firebase@^10.8.0/firestore",
        "firebase/storage": "https://esm.sh/firebase@^10.8.0/storage",
        "firebase/functions": "https://esm.sh/firebase@^10.8.0/functions",
        "@stripe/stripe-js": "https://esm.sh/@stripe/stripe-js@^2.1.0",
        "idb": "https://esm.sh/idb@^8.0.0",
        "crypto-js": "https://esm.sh/crypto-js@^4.2.0",
        "zod": "https://esm.sh/zod@^3.22.4"
      }
    }
  </script>
  <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-grid">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
